[package]
name = "tauri-cef-helper"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
cef = { version = "=146.4.1", default-features = false }
# Not actually used directly, just locking it.
cef-dll-sys = { version = "=146.4.1", default-features = false }

[features]
# Sandbox disabled by default: the helper binary panics at
# `Sandbox::initialize` in local dev because the sandbox dylib isn't wired up
# under `tauri dev` (it's only staged correctly by the full release bundler).
# Re-enable with `--features sandbox` for production builds.
default = []
sandbox = ["cef/sandbox"]

# Ensure this crate is NOT treated as part of the repo workspace.
[workspace]
